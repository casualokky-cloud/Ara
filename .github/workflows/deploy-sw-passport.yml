name: Deploy SW Passport to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["speedwork-passport/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload speedwork-passport as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: speedwork-passport

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
